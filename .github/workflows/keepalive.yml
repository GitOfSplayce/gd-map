name: Maintien en éveil de Supabase

# Un projet Supabase du plan Free est mis en pause s'il ne reçoit pas quelques requêtes par jour
# sur une semaine. Ce workflow appelle la fonction ping() deux fois par jour. Inutile avec le plan Pro.
on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Appel de ping()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Sur un dépôt public, GitHub désactive les workflows programmés après 60 jours sans commit.
      # Réactiver celui-ci à chaque passage remet ce compteur à zéro, sans commit.
      - name: Réactivation du workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
