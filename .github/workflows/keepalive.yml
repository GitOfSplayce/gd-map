name: Maintien en éveil de Supabase

# Un projet Supabase du plan Free est mis en pause après 7 jours sans activité.
# Ce workflow appelle la fonction ping() deux fois par semaine. Inutile avec le plan Pro.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de ping()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
